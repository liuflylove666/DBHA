name: dbha-v2-lab

x-node-env: &node-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run configure.py first}
  MYSQL_ROOT_HOST: "%"
  MYSQL_REPL_USER: ${MYSQL_REPL_USER}
  MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
  DBHA_USER: ${DBHA_USER}
  DBHA_PASSWORD: ${DBHA_PASSWORD}
  APP_PASSWORD: ${APP_PASSWORD}
  SSH_PASSWORD: ${SSH_PASSWORD}

x-mysql: &mysql
  image: dbha-v2-lab-mysql:local
  platform: linux/amd64
  build:
    context: ./nodes
    dockerfile: Dockerfile.mysql
  environment: *node-env
  restart: "no"
  depends_on:
    dbha-server:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 40
    start_period: 30s

x-proxy: &proxy
  image: dbha-v2-lab-proxy:local
  platform: linux/amd64
  build:
    context: ./nodes
    dockerfile: Dockerfile.proxy
  environment:
    PROXY_ADMIN_USER: ${PROXY_ADMIN_USER}
    PROXY_ADMIN_PASSWORD: ${PROXY_ADMIN_PASSWORD}
    SSH_PASSWORD: ${SSH_PASSWORD}
    DBHA_SERVER_URL: http://10.203.80.12:8080
  restart: "no"
  depends_on:
    dbha-server:
      condition: service_healthy

services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.0
    command: ["/usr/local/bin/etcd", "--name=lab", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://10.203.80.11:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://10.203.80.11:2380", "--initial-cluster=lab=http://10.203.80.11:2380", "--auto-compaction-mode=periodic", "--auto-compaction-retention=1h", "--quota-backend-bytes=2147483648"]
    volumes:
      - etcd-data:/etcd-data
      - ./backups:/backups
    # Loopback-only port for isolated integration tests; never expose publicly.
    ports: ["127.0.0.1:12379:2379"]
    networks:
      lab: {ipv4_address: 10.203.80.11}
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  dbha-server:
    image: dbha-v2-lab-runtime:local
    platform: linux/amd64
    command: ["dbha-server", "-c", "/etc/dbha/server.json"]
    volumes:
      - ./generated:/etc/dbha:ro
      - server-state:/var/lib/dbha-server
      - server-logs:/var/log/dbha-server
    depends_on:
      etcd: {condition: service_healthy}
    networks:
      lab: {ipv4_address: 10.203.80.12}
    ports: ["127.0.0.1:18080:8080"]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-master:
    <<: *mysql
    command: ["--server-id=21", "--log-bin=mysql-bin", "--relay-log=dbha-relay-bin", "--relay-log-index=dbha-relay-bin.index", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-slave-updates=ON", "--binlog-format=ROW", "--sync-binlog=1", "--innodb-flush-log-at-trx-commit=1", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - master-data:/var/lib/mysql
      - master-probe-state:/var/lib/dbha-probe
      - ./generated/lab-mysql-master-discovery.json:/etc/dbha/discovery.json:ro
      - ./generated/lab-mysql-master-agent.token:/etc/dbha/agent.token:ro
      - ./generated/lab-mysql-master-dbha.password:/etc/dbha/dbha.password:ro
      - ./generated/lab-mysql-master-ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./generated/lab-mysql-master-ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro
    networks:
      lab: {ipv4_address: 10.203.80.21}

  mysql-standby:
    <<: *mysql
    command: ["--server-id=22", "--log-bin=mysql-bin", "--relay-log=dbha-relay-bin", "--relay-log-index=dbha-relay-bin.index", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-slave-updates=ON", "--binlog-format=ROW", "--sync-binlog=1", "--innodb-flush-log-at-trx-commit=1", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - standby-data:/var/lib/mysql
      - standby-probe-state:/var/lib/dbha-probe
      - ./generated/lab-mysql-standby-discovery.json:/etc/dbha/discovery.json:ro
      - ./generated/lab-mysql-standby-agent.token:/etc/dbha/agent.token:ro
      - ./generated/lab-mysql-standby-dbha.password:/etc/dbha/dbha.password:ro
      - ./generated/lab-mysql-standby-ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./generated/lab-mysql-standby-ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro
    networks:
      lab: {ipv4_address: 10.203.80.22}

  bootstrap:
    image: dbha-v2-lab-mysql:local
    platform: linux/amd64
    entrypoint: ["bash", "/usr/local/bin/mysql-replication.sh"]
    environment:
      <<: *node-env
      MYSQL_MASTER: 10.203.80.21
      MYSQL_STANDBY: 10.203.80.22
    volumes: [bootstrap-state:/state]
    depends_on:
      mysql-master: {condition: service_healthy}
      mysql-standby: {condition: service_healthy}
    networks: [lab]

  proxy1:
    <<: *proxy
    environment:
      PROXY_ADMIN_USER: ${PROXY_ADMIN_USER}
      PROXY_ADMIN_PASSWORD: ${PROXY_ADMIN_PASSWORD}
      SSH_PASSWORD: ${SSH_PASSWORD}
      DBHA_SERVER_URL: http://10.203.80.12:8080
      DBHA_AGENT_ID: ${PROXY1_AGENT_ID:?Run configure.py first}
    volumes:
      - proxy1-probe-state:/var/lib/dbha-probe
      - ./generated/lab-proxy1-discovery.json:/etc/dbha/discovery.json:ro
      - ./generated/lab-proxy1-agent.token:/etc/dbha/agent.token:ro
      - ./generated/lab-proxy1-proxy-admin.password:/etc/dbha/proxy-admin.password:ro
      - ./generated/lab-proxy1-ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./generated/lab-proxy1-ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro
    ports: ["127.0.0.1:13306:10000"]
    networks:
      lab: {ipv4_address: 10.203.80.31}

  proxy2:
    <<: *proxy
    environment:
      PROXY_ADMIN_USER: ${PROXY_ADMIN_USER}
      PROXY_ADMIN_PASSWORD: ${PROXY_ADMIN_PASSWORD}
      SSH_PASSWORD: ${SSH_PASSWORD}
      DBHA_SERVER_URL: http://10.203.80.12:8080
      DBHA_AGENT_ID: ${PROXY2_AGENT_ID:?Run configure.py first}
    volumes:
      - proxy2-probe-state:/var/lib/dbha-probe
      - ./generated/lab-proxy2-discovery.json:/etc/dbha/discovery.json:ro
      - ./generated/lab-proxy2-agent.token:/etc/dbha/agent.token:ro
      - ./generated/lab-proxy2-proxy-admin.password:/etc/dbha/proxy-admin.password:ro
      - ./generated/lab-proxy2-ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./generated/lab-proxy2-ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro
    ports: ["127.0.0.1:13307:10000"]
    networks:
      lab: {ipv4_address: 10.203.80.32}

networks:
  lab:
    ipam:
      config: [{subnet: 10.203.80.0/24}]
volumes:
  etcd-data:
  server-state:
  server-logs:
  master-data:
  standby-data:
  bootstrap-state:
  master-probe-state:
  standby-probe-state:
  proxy1-probe-state:
  proxy2-probe-state:
